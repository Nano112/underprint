name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - run: cargo check --locked --workspace

  dependency-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check

  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --locked --profile minimal-release -p underprint-cli -p underprint-ffi -p underprint-server
      - run: ./scripts/check-abi-sync.sh
      - run: ./scripts/test-c-abi.sh
        if: runner.os != 'Windows'
      - name: Check shared-library exports
        if: runner.os != 'Windows'
        run: |
          find target/minimal-release -maxdepth 1 -type f \
            \( -name 'libunderprint.so' -o -name 'libunderprint.dylib' \) \
            -exec ./scripts/check-exports.sh {} \;
      - uses: actions/upload-artifact@v7
        with:
          name: underprint-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            target/minimal-release/underprint
            target/minimal-release/underprint.exe
            target/minimal-release/underprint-server
            target/minimal-release/underprint-server.exe
            target/minimal-release/libunderprint.so
            target/minimal-release/libunderprint.dylib
            target/minimal-release/underprint.dll
            include/underprint.h
            models/manifest.json
            LICENSE
            NOTICE
            THIRD_PARTY_LICENSES.md

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - run: cargo build --profile minimal-release -p underprint-ffi
      - uses: actions/setup-go@v6
        with:
          go-version-file: bindings/go/go.mod
      - run: go test ./...
        working-directory: bindings/go
        env:
          LD_LIBRARY_PATH: ../../target/minimal-release

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ffi
      - run: composer validate --strict
        working-directory: bindings/php
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
        working-directory: bindings/php
      - run: php -l benchmarks/ffi.php

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: cargo +nightly fuzz build
        working-directory: fuzz

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: AddressSanitizer core tests
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: cargo +nightly test -p underprint --target x86_64-unknown-linux-gnu

  container:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag underprint:ci .
      - name: Inspect minimal runtime
        run: |
          test "$(docker image inspect underprint:ci --format '{{.Config.User}}')" = "65532:65532"
          docker run --rm --read-only --entrypoint /bin/sh underprint:ci -c '
            test ! -w /app
            test ! -e /usr/local/bin/cargo
            test ! -e /usr/local/bin/rustc
            test ! -e /usr/bin/python3
          '
