[workspace]
members = [
    "crates/underprint",
    "crates/underprint-cli",
    "crates/underprint-ffi",
    "crates/underprint-server",
    "crates/underprint-trustmark",
    "vendor/trustmark",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Nano112/underprint"
authors = ["Underprint contributors"]

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
clap = { version = "4.5.54", features = ["derive", "env"] }
underprint = { path = "crates/underprint", version = "0.1.0" }
underprint-trustmark = { path = "crates/underprint-trustmark", version = "0.1.0" }
hex = "0.4.3"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.24.0"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "limit", "request-id", "sensitive-headers", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
trustmark = { path = "vendor/trustmark", version = "0.2.2" }
uuid = { version = "1.24.1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.minimal-release]
inherits = "release"
lto = "fat"

[profile.release-debug]
inherits = "release"
strip = "none"
debug = 1
