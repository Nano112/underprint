[workspace]
members = [
    "crates/underprint",
    "crates/underprint-cli",
    "crates/underprint-ffi",
    "crates/underprint-trustmark",
    "vendor/trustmark",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Schem-at/underprint"
authors = ["Underprint contributors"]

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive", "env"] }
underprint = { path = "crates/underprint", version = "0.1.0" }
underprint-trustmark = { path = "crates/underprint-trustmark", version = "0.1.0" }
hex = "0.4.3"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.24.0"
thiserror = "2.0.17"
trustmark = { path = "vendor/trustmark", version = "0.2.2" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.minimal-release]
inherits = "release"
lto = "fat"

[profile.release-debug]
inherits = "release"
strip = "none"
debug = 1
