[package]
name = "trustmark"
version = "0.2.2"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Underprint-maintained native TrustMark implementation"
repository = "https://github.com/adobe/trustmark"
publish = false

[dependencies]
fast_image_resize = { version = "5.1.4", default-features = false, features = ["image", "rayon"] }
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "webp"] }
ndarray = "0.16"
ort = "=2.0.0-rc.8"
ort-sys = { version = "=2.0.0-rc.8", default-features = false }
thiserror = "1"
